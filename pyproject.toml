[project]
name = "weather-mcp-server"
version = "0.1.0"
description = "An MCP server exposing weather lookups and an activity-based outdoor planning advisor."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
weather-mcp = "weather_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises the real server over stdio and calls the live Open-Meteo API",
]
addopts = "-m 'not integration'"
